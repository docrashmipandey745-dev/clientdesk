<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-soft: #fbfbf9;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text-2: #666;
    --text-3: #999;
    --blue: #185FA5;
    --blue-light: #e6f1fb;
    --blue-mid: #B5D4F4;
    --blue-dark: #0C447C;
    --green-light: #eaf3de;
    --green-text: #27500A;
    --amber-light: #faeeda;
    --amber-text: #633806;
    --red: #A32D2D;
    --red-light: #fcebeb;
    --purple-light: #eee7fb;
    --purple-text: #51368a;
    --radius: 11px;
    --radius-lg: 16px;
    --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1c1c1b; --surface-soft: #171716;
      --border: rgba(255,255,255,0.10); --border-md: rgba(255,255,255,0.20);
      --text: #f0ede8; --text-2: #aaa; --text-3: #777;
      --blue: #4a9eed; --blue-light: #0c2d4a; --blue-mid: #1a4a7a; --blue-dark: #85B7EB;
      --green-light: #102607; --green-text: #C0DD97;
      --amber-light: #2a1a04; --amber-text: #FAC775;
      --red: #f09595; --red-light: #2a0a0a;
      --purple-light: #241a36; --purple-text: #d3c5ff;
    }
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font-ui); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; }
  .app { display: flex; height: 100dvh; }
  .sidebar { width: 230px; background: var(--surface); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { padding: 1.25rem 1.25rem 1rem; border-bottom: 0.5px solid var(--border); }
  .logo-mark { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; background: var(--blue); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .logo-title { font-size: 15px; font-weight: 750; letter-spacing: -0.35px; }
  .logo-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .nav { padding: 0.9rem 0.75rem; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14px; color: var(--text-2); border: none; background: none; width: 100%; text-align: left; transition: 0.14s; }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { background: var(--blue-light); color: var(--blue); font-weight: 600; }
  .nav-item i { font-size: 19px; }
  .nav-badge { margin-left: auto; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px; min-width: 20px; text-align: center; }
  .sidebar-footer { padding: 0.9rem 1.25rem; border-top: 0.5px solid var(--border); font-size: 12px; color: var(--text-3); line-height: 1.35; }
  .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0.85rem 1.35rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
  .topbar h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.35px; }
  .content { flex: 1; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; }
  .btn, .add-btn { border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: 0.12s; }
  .btn { padding: 8px 14px; font-size: 13px; border: 0.5px solid var(--border-md); background: var(--surface); color: var(--text); }
  .btn:hover { background: var(--bg); }
  .add-btn, .btn-primary { background: var(--blue); color: #fff; border: 0.5px solid var(--blue); }
  .add-btn { padding: 9px 15px; font-size: 13px; }
  .add-btn:hover, .btn-primary:hover { background: var(--blue-dark); }
  .btn-danger { color: var(--red); border-color: var(--red-light); }
  .btn-danger:hover { background: var(--red-light); }
  .btn-ghost { background: transparent; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.1rem; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; }
  .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.15rem; }
  .stat-label { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .section-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-soft); font-size: 13px; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { color: var(--text-3); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time-pill { color: var(--blue); font-weight: 750; min-width: 54px; }
  .badge { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 650; }
  .badge-blue { background: var(--blue-light); color: var(--blue); }
  .badge-green { background: var(--green-light); color: var(--green-text); }
  .badge-amber { background: var(--amber-light); color: var(--amber-text); }
  .badge-red { background: var(--red-light); color: var(--red); }
  .badge-purple { background: var(--purple-light); color: var(--purple-text); }
  .empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 2rem 1rem; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav-btn { background: var(--surface); border: 0.5px solid var(--border-md); border-radius: var(--radius); padding: 7px 11px; cursor: pointer; color: var(--text-2); font-size: 15px; }
  .cal-month-label { font-size: 16px; font-weight: 700; min-width: 160px; text-align: center; letter-spacing: -0.3px; }
  .cal-grid { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .cal-days-header, .cal-cells { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-days-header { border-bottom: 0.5px solid var(--border); }
  .cal-day-name { padding: 10px 6px; text-align: center; font-size: 11px; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .cal-cell { border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); min-height: 92px; padding: 6px 7px; cursor: pointer; transition: 0.1s; position: relative; }
  .cal-cell:hover { background: var(--bg); }
  .cal-cell.other-month { opacity: 0.32; pointer-events: none; }
  .cal-cell.today .day-num { background: var(--blue); color: #fff; border-radius: 50%; font-weight: 750; }
  .cal-cell.selected { background: var(--blue-light) !important; }
  .day-num { font-size: 13px; font-weight: 550; margin-bottom: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .appt-chip { font-size: 10px; background: var(--blue-light); color: var(--blue); border-radius: 6px; padding: 2px 6px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-weight: 650; }
  .appt-chip.followup { background: var(--purple-light); color: var(--purple-text); }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 13px; }
  .type-option { border: 0.5px solid var(--border-md); background: var(--surface-soft); border-radius: var(--radius); padding: 11px 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .type-option.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }
  .appt-type-pill { min-width: 34px; text-align: center; justify-content: center; }
  .more-chip { font-size: 10px; color: var(--text-3); padding-left: 2px; }
  .table-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  thead th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 750; color: var(--text-3); border-bottom: 0.5px solid var(--border); background: var(--bg); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  tbody td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tbody tr:hover td { background: var(--bg); }
  tbody tr:last-child td { border-bottom: none; }
  .pid { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; color: var(--text-3); }
  .text-trunc { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-btn { background: none; border: 0.5px solid var(--border-md); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 5px; }
  .search-wrap { position: relative; }
  .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 16px; pointer-events: none; }
  .search-input { padding: 9px 12px 9px 34px; border: 0.5px solid var(--border-md); border-radius: var(--radius); font-size: 13px; background: var(--bg); color: var(--text); width: 260px; outline: none; }
  .search-input:focus { border-color: var(--blue); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.42); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); padding: 1rem; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.45rem; width: 560px; max-width: 100%; border: 0.5px solid var(--border-md); max-height: 90dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal.wide { width: 760px; }
  .modal-title { font-size: 16px; font-weight: 750; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
  .form-row label { font-size: 12px; color: var(--text-2); font-weight: 650; }
  .form-row input, .form-row textarea, .form-row select { width: 100%; padding: 11px 12px; border: 0.5px solid var(--border-md); border-radius: var(--radius); font-size: 15px; background: var(--bg); color: var(--text); outline: none; -webkit-appearance: none; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--blue); }
  .form-row textarea { resize: vertical; min-height: 150px; line-height: 1.45; }
  .form-row textarea.big-notes { min-height: 260px; font-size: 16px; line-height: 1.55; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
  .visit-box { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; background: var(--surface-soft); }
  .visit-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 7px; }
  .visit-title { font-size: 13px; font-weight: 750; }
  .visit-body { font-size: 13px; color: var(--text-2); line-height: 1.45; white-space: pre-wrap; }
  .status-select { min-width: 122px; padding: 7px 30px 7px 11px; border: 1px solid transparent; border-radius: 999px; font-size: 12px; font-weight: 750; letter-spacing: -0.1px; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.04); }
  .status-booked { background: var(--blue-light); color: var(--blue); border-color: rgba(24,95,165,.22); }
  .status-waiting { background: var(--amber-light); color: var(--amber-text); border-color: rgba(99,56,6,.18); }
  .status-seen { background: var(--green-light); color: var(--green-text); border-color: rgba(39,80,10,.18); }
  .status-cancelled { background: var(--red-light); color: var(--red); border-color: rgba(163,45,45,.18); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .dot-booked { background: var(--blue); }
  .dot-waiting { background: var(--amber-text); }
  .dot-seen { background: var(--green-text); }
  .dot-cancelled { background: var(--red); }
  .hint { font-size: 12px; color: var(--text-3); line-height: 1.35; }
  .warning { font-size: 12px; color: var(--red); margin-top: 6px; font-weight: 650; }
  .match-box { border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-soft); padding: 10px 12px; margin-top: -5px; margin-bottom: 13px; font-size: 13px; }
  .match-ok { color: var(--green-text); font-weight: 650; }
  .match-new { color: var(--amber-text); font-weight: 650; }
  .patient-results { border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-top: 6px; overflow: hidden; max-height: 220px; overflow-y: auto; display: none; }
  .patient-result { width: 100%; text-align: left; border: 0; border-bottom: 0.5px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 12px; cursor: pointer; display: block; }
  .patient-result:last-child { border-bottom: 0; }
  .patient-result:hover { background: var(--bg); }
  .patient-result-name { font-weight: 750; font-size: 14px; }
  .patient-result-meta { color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .meta-label { font-weight: 700; color: var(--text-2); }
  @media (max-width: 820px) {
    .sidebar { width: 64px; }
    .logo-text, .nav-item span.label, .sidebar-footer { display: none; }
    .logo { padding: 1rem 0; display: flex; justify-content: center; }
    .logo-mark { justify-content: center; }
    .nav { padding: 0.75rem 0.4rem; }
    .nav-item { justify-content: center; padding: 10px; }
    .nav-badge { display: none; }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .cal-month-label { font-size: 14px; min-width: 120px; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .search-input { width: 180px; }
  }
  @media (max-width: 600px) {
    .content { padding: 0.9rem; }
    .grid-3 { grid-template-columns: 1fr; }
    .form-2col, .form-3col { grid-template-columns: 1fr; }
    .cal-cell { min-height: 72px; padding: 5px; }
    .appt-chip { display: none; }
  }

  /* ── Voice dictation ── */
  .voice-bar { display: flex; align-items: center; gap: 10px; background: var(--blue-light); border: 0.5px solid var(--blue-mid); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
  .mic-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; transition: all 0.15s; }
  .mic-btn.idle { background: var(--blue); color: #fff; }
  .mic-btn.idle:hover { background: var(--blue-dark); }
  .mic-btn.listening { background: #e53e3e; color: #fff; animation: pulse-mic 1.2s ease-in-out infinite; }
  .mic-btn.processing { background: var(--amber-text); color: #fff; }
  @keyframes pulse-mic { 0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,0.4)} 50%{box-shadow:0 0 0 8px rgba(229,62,62,0)} }
  .voice-status { flex: 1; font-size: 13px; color: var(--blue); font-weight: 500; }
  .voice-status.dim { color: var(--text-3); font-weight: 400; }
  .voice-transcript { font-size: 12px; color: var(--text-2); margin-top: 3px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .voice-filled { font-size: 12px; color: var(--green-text); background: var(--green-light); border-radius: 6px; padding: 6px 10px; margin-top: 8px; }

  /* ── Voice dictation ── */
  .voice-bar { display: flex; align-items: center; gap: 10px; background: var(--blue-light); border: 0.5px solid var(--blue-mid); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
  .mic-btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; transition: all 0.15s; }
  .mic-btn.idle { background: var(--blue); color: #fff; }
  .mic-btn.idle:hover { background: var(--blue-dark); }
  .mic-btn.listening { background: #e53e3e; color: #fff; animation: pulse-mic 1.2s ease-in-out infinite; }
  .mic-btn.processing { background: var(--amber-text); color: #fff; pointer-events: none; }
  @keyframes pulse-mic { 0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,0.4)} 50%{box-shadow:0 0 0 9px rgba(229,62,62,0)} }
  .voice-status { flex: 1; font-size: 13px; color: var(--blue); font-weight: 600; }
  .voice-status.dim { color: var(--text-3); font-weight: 400; }
  .voice-transcript { font-size: 12px; color: var(--text-2); margin-top: 3px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
  .voice-filled { font-size: 12px; color: var(--green-text); background: var(--green-light); border-radius: 6px; padding: 6px 10px; margin-top: 8px; line-height: 1.5; }

</style>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const STATUS = ['Booked','Waiting','Seen','Cancelled'];
const APPT_TYPES = ['New Patient','Follow-up'];
const now = new Date();
let cloudReady = !!supabaseClient;
let cloudLoading = false;
let cloudSaveTimer = null;
let state = {
  tab: 'today',
  calYear: now.getFullYear(),
  calMonth: now.getMonth(),
  selectedDate: toDateStr(now),
  patients: JSON.parse(localStorage.getItem('cd2_patients') || localStorage.getItem('cd_patients') || '[]'),
  appointments: JSON.parse(localStorage.getItem('cd2_appointments') || localStorage.getItem('cd_appointments') || '[]'),
  patientSearch: ''
};
state.patients = state.patients.map(p => ({ visits: [], ...p, phone: p.phone || p.contact || '' }));
state.appointments = state.appointments.map(a => ({ status: 'Booked', apptType: 'Follow-up', ...a, ...parseStoredAppointmentNote(a.note || '') }));
function toDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }
function esc(str){ return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function genId(prefix){ return prefix + Math.random().toString(36).substr(2,6).toUpperCase(); }
function parseStoredAppointmentNote(note){
  const raw=String(note||'');
  const m=raw.match(/^__APPT_TYPE__:(New Patient|Follow-up)\n?/);
  if(!m) return { apptType:'Follow-up', note:raw };
  return { apptType:m[1], note:raw.replace(/^__APPT_TYPE__:(New Patient|Follow-up)\n?/, '') };
}
function packAppointmentNote(a){ return '__APPT_TYPE__:'+(a.apptType||'Follow-up')+'\n'+(a.note||''); }
function apptTypeBadge(type){ const t=type||'Follow-up'; const cls=t==='New Patient'?'badge-blue':'badge-purple'; return '<span class="badge '+cls+' appt-type-pill">'+(t==='New Patient'?'N':'F')+'</span>'; }
function apptTypeLabel(type){ return (type||'Follow-up')==='New Patient'?'New patient':'Follow-up'; }

function dbPatientRows(){

  }));
}
function dbAppointmentRows(){
  return state.appointments.map(a=>({
    id:String(a.id), patient_id:String(a.patientId||a.patient_id), date:a.date||'', time:a.time||'', note:packAppointmentNote(a), status:a.status||'Booked', created_at:a.created_at||a.createdAt||new Date().toISOString()
  }));
}
function dbVisitRows(){
  const rows=[];
  state.patients.forEach(p=>(p.visits||[]).forEach(v=>rows.push({
    id:String(v.id), patient_id:String(p.id), visit_date:v.date||v.visit_date||'', notes:v.notes||'', prescription:v.prescription||'', follow_up_date:v.followUpDate||v.follow_up_date||'', created_at:v.created_at||v.createdAt||new Date().toISOString()
  })));
  return rows;
}
async function loadFromCloud(){
  if(!cloudReady){ setCloudStatus('Data saved on this browser.<br>Cloud not connected.'); return false; }
  try{
    cloudLoading=true; setCloudStatus('Cloud sync connected.<br>Loading data…');
    const [pr, ar, vr] = await Promise.all([
      supabaseClient.from('patients').select('*'),
      supabaseClient.from('appointments').select('*'),
      supabaseClient.from('visits').select('*')
    ]);
    if(pr.error || ar.error || vr.error) throw (pr.error || ar.error || vr.error);
    const patients=(pr.data||[]).map(p=>({id:p.id,name:p.name,age:p.age||'',phone:p.phone||'',notes:p.notes||'',createdAt:p.created_at,visits:[]}));
    const byId=Object.fromEntries(patients.map(p=>[p.id,p]));
    (vr.data||[]).forEach(v=>{
      if(byId[v.patient_id]) byId[v.patient_id].visits.push({id:v.id,date:v.visit_date||'',notes:v.notes||'',prescription:v.prescription||'',followUpDate:v.follow_up_date||'',createdAt:v.created_at});
    });
    const appointments=(ar.data||[]).map(a=>{ const parsed=parseStoredAppointmentNote(a.note||''); return {id:a.id,patientId:a.patient_id,date:a.date,time:a.time,note:parsed.note||'',apptType:parsed.apptType||'Follow-up',status:a.status||'Booked',createdAt:a.created_at}; });
    if(patients.length || appointments.length || (vr.data||[]).length){
      state.patients=patients; state.appointments=appointments;
      localStorage.setItem('cd2_patients', JSON.stringify(state.patients));
      localStorage.setItem('cd2_appointments', JSON.stringify(state.appointments));
    } else if(state.patients.length || state.appointments.length){
      await syncToCloud();
    }
    setCloudStatus('Cloud sync active.<br>iPad + PC can share data.');
    return true;
  }catch(err){
    console.error('Supabase load error:', err);
    setCloudStatus('Cloud sync error.<br>Using local browser data.');
    return false;
  }finally{ cloudLoading=false; updateBadges(); render(); }
}
async function syncToCloud(){
  if(!cloudReady) return;
  try{
    setCloudStatus('Cloud sync active.<br>Saving…');
    await supabaseClient.from('visits').delete().neq('id','__never__');
    await supabaseClient.from('appointments').delete().neq('id','__never__');
    await supabaseClient.from('patients').delete().neq('id','__never__');
    const patients=dbPatientRows(), appointments=dbAppointmentRows(), visits=dbVisitRows();
    if(patients.length){ const r=await supabaseClient.from('patients').insert(patients); if(r.error) throw r.error; }
    if(appointments.length){ const r=await supabaseClient.from('appointments').insert(appointments); if(r.error) throw r.error; }
    if(visits.length){ const r=await supabaseClient.from('visits').insert(visits); if(r.error) throw r.error; }
    setCloudStatus('Cloud sync active.<br>Saved.');
  }catch(err){
    console.error('Supabase save error:', err);
    setCloudStatus('Cloud sync error.<br>Local copy still saved.');
  }
}

function cleanPatientQuery(q){ return String(q||'').split('—')[0].trim(); }
function patientSearchText(p){ return [p.id, p.name, p.phone, p.contact].filter(Boolean).join(' ').toLowerCase(); }
function patientMatchesQuery(p, q){
  q=String(q||'').trim().toLowerCase();
  if(!q) return false;
  return patientSearchText(p).includes(q);
}
function getPatientMatches(q){
  q=cleanPatientQuery(q).toLowerCase();
  if(!q) return [];
  const exact=[];
  const partial=[];
  state.patients.forEach(p=>{
    const id=String(p.id||'').toLowerCase();
    const name=String(p.name||'').toLowerCase();
    const phone=String(p.phone||p.contact||'').toLowerCase();
    if(id===q || name===q || phone===q) exact.push(p);
    else if(patientMatchesQuery(p,q)) partial.push(p);
  });
  const seen=new Set();
  return exact.concat(partial).filter(p=>{ const key=String(p.id); if(seen.has(key)) return false; seen.add(key); return true; }).slice(0,8);
}
function findPatientFromQuery(q){ return getPatientMatches(q)[0] || null; }

  const hidden=document.getElementById('m-appt-type'), selected=document.getElementById('m-selected-patient-id');
  renderPatientResults(q);
  if(!q){
    matchBox.innerHTML='<span class="hint">Type a patient ID, name, or phone number.</span>';
    if(decision) decision.style.display='none';
    if(hidden) hidden.value='';
    if(selected) selected.value='';
    return;
  }
  if(match){
    matchBox.innerHTML='<span class="match-ok">Existing patient found:</span><div style="margin-top:5px"><strong>'+esc(match.name||'Unnamed patient')+'</strong></div><div class="hint"><span class="meta-label">ID:</span> '+esc(match.id)+' &nbsp; <span class="meta-label">Phone:</span> '+esc(match.phone||match.contact||'—')+'</div><div class="hint" style="margin-top:4px">This appointment will be saved automatically as a follow-up.</div>';
    if(decision) decision.style.display='none';
    if(hidden) hidden.value='Follow-up';
    if(selected) selected.value=match.id;
  } else {
    matchBox.innerHTML='<span class="match-new">No matching patient in the app.</span>';
    if(decision) decision.style.display='block';
    if(hidden && !hidden.value) hidden.value='';
    if(selected) selected.value='';
    // Always keep the ID field in sync with whatever is typed — don't stop after first fill
    const pid=document.getElementById('m-new-pid');
    if(pid) pid.value=q;
    const nm=document.getElementById('m-new-name');
    if(nm && nm.value===q) nm.value='';
    setUnmatchedAppointmentType(hidden?.value || '');
  }
}
function saveAppt(apptId){
  const date=document.getElementById('m-date').value, time=document.getElementById('m-time').value, note=document.getElementById('m-note').value, status=document.getElementById('m-status').value;
  if(!date||!time){ alert('Please fill date and time.'); return; }
  let patient=findPatientFromQuery(document.getElementById('m-patient-query').value);
  let apptType='Follow-up';
  if(!patient){
    apptType=document.getElementById('m-appt-type')?.value || '';
    if(!apptType){ alert('No matching patient found. Please choose New patient or Follow-up, old patient not in app.'); return; }
    const newId=cleanPatientQuery(document.getElementById('m-patient-query').value).trim() || (document.getElementById('m-new-pid')?.value||'').trim();
    const newName=(document.getElementById('m-new-name')?.value||'').trim();
    const newPhone=(document.getElementById('m-new-phone')?.value||'').trim();
    if(!newId){ alert('Please enter the patient ID.'); return; }
    const existing=state.patients.find(p=>String(p.id).toLowerCase()===newId.toLowerCase());
    if(existing){
      patient=existing;
      apptType='Follow-up';
      if(newName && !patient.name) patient.name=newName;
      if(newPhone && !patient.phone) patient.phone=newPhone;
    } else {
      patient={id:newId,name:newName || 'Patient '+newId,age:'',phone:newPhone,notes: apptType==='Follow-up' ? 'Existing patient; first entry in this app.' : '',visits:[],createdAt:new Date().toISOString()};
      state.patients.push(patient);
    }
  } else {
    apptType='Follow-up';
  }
  const patientId=patient.id;
  if(apptId){ const i=state.appointments.findIndex(a=>a.id===apptId); state.appointments[i]={...state.appointments[i],date,time,patientId,note,status,apptType}; }
  else state.appointments.push({id:genId('A'),date,time,patientId,note,status,apptType});

}

function checkPatientIdDuplicate(currentPid){
  const el=document.getElementById('p-id'), warn=document.getElementById('p-id-warning');
  if(!el || !warn) return false;
  const value=el.value.trim().toLowerCase();
  const exists=!!value && state.patients.some(p=>String(p.id).toLowerCase()===value && p.id!==currentPid);
  warn.style.display=exists?'block':'none';
  return exists;
}
function savePatient(pid){

  else state.patients.push({...data, visits:[], createdAt:new Date().toISOString()});
  save(); closeModal(); render();
}
function deletePatient(pid){ if(!confirm('Delete this patient and all their appointments?')) return; state.patients=state.patients.filter(p=>p.id!==pid); state.appointments=state.appointments.filter(a=>a.patientId!==pid); save(); closeModal(); render(); }

function saveVisit(pid,vid){ const p=state.patients.find(x=>x.id===pid); if(!p.visits) p.visits=[]; const data={date:document.getElementById('v-date').value, followUpDate:document.getElementById('v-follow').value, notes:document.getElementById('v-notes').value, prescription:document.getElementById('v-rx').value}; if(vid){ const i=p.visits.findIndex(v=>v.id===vid); p.visits[i]={...p.visits[i],...data}; } else p.visits.push({id:genId('V'),...data}); save(); openPatientModal(pid); }

// ── Voice dictation ────────────────────────────────────────────────
const GEMINI_PROXY = 'https://flekzzvvrozxwdqxsixd.supabase.co/functions/v1/ask-gemini';
const SUPABASE_ANON = 'sb_publishable_W051xVL3lo5ZoSwf0jyxow_1u-y9aCz';

let voiceRecognition = null;
let currentVoiceContext = null;

function voiceBarHTML(context) {
  return `<div class="voice-bar" id="voice-bar-${context}">
    <button class="mic-btn idle" id="voice-mic-${context}" onclick="startVoice('${context}')" title="Tap and speak">
      <i class="ti ti-microphone"></i>
    </button>
    <div style="flex:1;min-width:0">
      <div class="voice-status dim" id="voice-status-${context}">Tap mic · speak · fields fill automatically</div>
      <div class="voice-transcript" id="voice-sub-${context}"></div>
    </div>
  </div>`;
}

function startVoice(context) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Speech recognition not supported. Use Chrome.');
    return;
  }

  // Stop any existing session
  if (voiceRecognition) { voiceRecognition.stop(); voiceRecognition = null; }

  currentVoiceContext = context;
  const btn = document.getElementById('voice-mic-' + context);
  const status = document.getElementById('voice-status-' + context);
  const sub = document.getElementById('voice-sub-' + context);

  const r = new SpeechRecognition();
  r.continuous = false;
  r.interimResults = true;
  r.lang = 'en-IN';
  voiceRecognition = r;

  btn.className = 'mic-btn listening';
  btn.innerHTML = '<i class="ti ti-player-stop-filled"></i>';
  btn.onclick = () => { if (voiceRecognition) voiceRecognition.stop(); };
  status.className = 'voice-status';
  status.textContent = 'Listening… tap to stop';
  sub.textContent = '';

  let final = '';

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
      else interim = e.results[i][0].transcript;
    }
    sub.textContent = final || interim;
  };

  r.onerror = (e) => {
    voiceRecognition = null;
    btn.className = 'mic-btn idle';
    btn.innerHTML = '<i class="ti ti-microphone"></i>';
    btn.onclick = () => startVoice(context);
    status.className = 'voice-status dim';
    status.textContent = 'Tap mic · speak · fields fill automatically';
    if (e.error !== 'no-speech') alert('Mic error: ' + e.error + '. Make sure you allowed microphone access.');
  };

  r.onend = () => {
    voiceRecognition = null;
    if (!final.trim()) {
      btn.className = 'mic-btn idle';
      btn.innerHTML = '<i class="ti ti-microphone"></i>';
      btn.onclick = () => startVoice(context);
      status.className = 'voice-status dim';
      status.textContent = 'Tap mic · speak · fields fill automatically';
      return;
    }
    processWithGemini(final.trim(), context);
  };

  r.start();
}

async function processWithGemini(transcript, context) {
  const btn = document.getElementById('voice-mic-' + context);
  const status = document.getElementById('voice-status-' + context);
  const sub = document.getElementById('voice-sub-' + context);

  btn.className = 'mic-btn processing';
  btn.innerHTML = '<i class="ti ti-loader-2"></i>';
  status.textContent = 'Understanding…';
  sub.textContent = transcript;

  try {
    const resp = await fetch(GEMINI_PROXY, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON,
      },
      body: JSON.stringify({ prompt: transcript, context }),
    });

    const raw = await resp.text();
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);

    applyVoiceData(parsed, context);

    // Show filled summary
    const barEl = document.getElementById('voice-bar-' + context);
    let filledEl = document.getElementById('voice-filled-' + context);
    if (!filledEl) {
      filledEl = document.createElement('div');
      filledEl.id = 'voice-filled-' + context;
      filledEl.className = 'voice-filled';
      barEl.appendChild(filledEl);
    }
    const summary = Object.entries(parsed).map(([k,v]) => '<strong>' + k.replace(/_/g,' ') + ':</strong> ' + v).join(' &nbsp;·&nbsp; ');
    filledEl.innerHTML = '✓ &nbsp;' + summary;

    status.textContent = 'Done! Review and save.';
    status.className = 'voice-status';
    sub.textContent = '';
  } catch(e) {
    status.textContent = 'Could not understand — please try again';
    status.className = 'voice-status dim';
    sub.textContent = '';
    console.error('Voice error:', e);
  }

  btn.className = 'mic-btn idle';
  btn.innerHTML = '<i class="ti ti-microphone"></i>';
  btn.onclick = () => startVoice(context);
}

function applyVoiceData(data, context) {
  const set = (id, val) => {
    const el = document.getElementById(id);
    if (el && val !== undefined && val !== null && String(val).trim()) {
      el.value = String(val).trim();
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }
  };
  if (context === 'appt') {
    set('m-date', data.date);
    set('m-time', data.time);
    set('m-note', data.note);
    if (data.status) set('m-status', data.status);
    if (data.patient_query) { set('m-patient-query', data.patient_query); updateApptPatientMatch(); }
  } else if (context === 'patient') {
    set('p-id', data.id);
    set('p-name', data.name);
    set('p-age', data.age);
    set('p-phone', data.phone);
    set('p-notes', data.notes);
  } else if (context === 'visit') {
    set('v-date', data.date);
    set('v-follow', data.follow_up_date);
    set('v-notes', data.notes);
    set('v-rx', data.prescription);
  }
}
